plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Secrets are injected from the environment at build time and there are no
// defaults: whatever goes here ends up readable inside the APK, so a
// placeholder is not a safety net, it is a published credential.
def requireEnv(String name) {
    def value = System.getenv(name)
    if (value == null || value.trim().isEmpty()) {
        throw new GradleException(
            "Missing environment variable ${name}. " +
            "Set it before building (see .env.example). " +
            "Refusing to embed a placeholder credential into the APK."
        )
    }
    return value.trim().replace("\\", "\\\\").replace("\"", "\\\"")
}

android {
    namespace 'com.outcome.c2'
    compileSdk 34

    defaultConfig {
        applicationId "com.outcome.c2"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        buildConfigField "String", "TG_BOT_TOKEN", "\"${requireEnv('TG_BOT_TOKEN')}\""
        buildConfigField "String", "TG_CHAT_ID",   "\"${requireEnv('TG_CHAT_ID')}\""
        buildConfigField "String", "API_KEY",      "\"${requireEnv('C2_API_KEY')}\""
        buildConfigField "String", "C2_URL",       "\"${requireEnv('C2_URL')}\""
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    packagingOptions {
        resources.excludes += "/META-INF/{AL2.0,LGPL2.1}"
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation ('io.socket:socket.io-client:2.1.1') {
        exclude group: 'org.json', module: 'json'
    }
}
